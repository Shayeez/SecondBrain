[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain"
version = "0.2.0"
description = "A sovereign, multi-user Second Brain with local VPS LLM routing and multimodal cloud intelligence."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "langchain>=0.1",
    "langchain-chroma>=0.1.0",
    "langchain-google-genai>=1.0",
    "chromadb>=0.4",
    "python-dotenv>=1.0",
    "google-genai>=0.5.0"
]

[project.scripts]
# Start the Second Brain Web Interface
start-brain = "second_brain.main:run_server"
start-web = "second_brain.main:run_server"