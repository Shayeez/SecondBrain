server {
    listen 80;
    server_name brain.yourdomain.com; # Replace with your domain

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name brain.yourdomain.com; # Replace with your domain

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/brain.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/brain.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow large audio, image, and PDF uploads
    client_max_body_size 100M;

    # Proxy to Second Brain FastAPI backend (adjust port if WEB_PORT in .env is different)
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;


        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer and timeout settings for file streaming and voice recording
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
