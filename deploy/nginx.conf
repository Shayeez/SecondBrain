# =============================================================================
# Second Brain - Nginx Subpath Configuration
# =============================================================================
# This snippet adds Second Brain at https://24x7care.org/secondbrain
# by adding a location block to your existing 24x7care.org server block.
#
# HOW TO USE:
#   1. Open your existing 24x7care.org Nginx config (the one that already has
#      SSL certificates and your other apps):
#         sudo nano /etc/nginx/sites-available/24x7care.org
#      (or whatever your existing config file is called)
#
#   2. Inside the existing `server { listen 443 ssl ... }` block, paste the
#      location block below (the section between the CUT HERE lines).
#
#   3. Test and reload:
#         sudo nginx -t
#         sudo systemctl reload nginx
#
# NO NEW SSL CERT NEEDED — it inherits your existing 24x7care.org certificate.
# NO NEW SERVER BLOCK NEEDED — everything goes inside the existing one.
# =============================================================================

# ─── CUT FROM HERE ────────────────────────────────────────────────────────────

    # --- Second Brain at /secondbrain ---
    # Strip the /secondbrain prefix and proxy to the FastAPI backend.
    location /secondbrain/ {
        proxy_pass http://127.0.0.1:8020/;  # trailing slash strips /secondbrain prefix
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future use / PWA cache)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Large uploads: audio, images, PDFs
        client_max_body_size 100M;

        # Generous timeouts for voice/AI processing
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Redirect bare /secondbrain (no trailing slash) → /secondbrain/
    location = /secondbrain {
        return 301 $scheme://$host/secondbrain/;
    }

# ─── CUT TO HERE ──────────────────────────────────────────────────────────────
